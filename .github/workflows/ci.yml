name: CI

# Build-only. This workflow does NOT deploy — production is Cloudflare Pages, direct upload
# via wrangler, driven by the hub's `ops/deploy-site.ps1 -Domain gagoline.co.il`.
# A green check here has never meant "shipped". See CLAUDE.md §10.
#
# PRECONDITION — this workflow cannot install until the site-kit is vendored.
# `package.json` resolves @ishub/site-kit from
#   file:../Israeli services sites/packages/site-kit/ishub-site-kit-0.0.0.tgz
# which is OUTSIDE this repository, so `npm ci` fails on a clean checkout. The fix is the one
# the rest of the fleet uses: copy the tarball to `vendor/` in this repo and point the
# dependency at `file:vendor/ishub-site-kit-0.0.0.tgz`. Until that lands, expect this job to
# fail at the install step — that failure is the reminder, not a bug in the workflow.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # All four are blocking. The scripts already existed; none were ever run in CI before.
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Format check
        run: npm run format:check
      - name: Build static export
        run: npm run build

      # Executable assertions on the artifact that actually ships. These replace the
      # hand-written greps that used to live only in the qa-build-gate skill — prose gates
      # do not fail builds, and one of those greps was silently broken for weeks.
      #
      # Covers: placeholder markers (by codepoint), doubled brand, title uniqueness,
      # one <h1>, canonicals, trailing slashes, unsourced ratings, sitemap parity.
      - name: SEO assertions
        run: npm run seo:assert

      # Orphans, missing trailing slashes and bad BreadcrumbList item URLs are fatal.
      # The inbound-degree threshold is advisory until Footer.tsx's cities.slice(0, 12)
      # is removed — append `-- --strict` here in the same commit that deletes it.
      - name: Link-graph assertions
        run: npm run links:check

      # The one artifact check the scripts don't cover.
      - name: Output weight
        run: |
          set -euo pipefail
          if find out -name '*.js' -size +1M | grep -q .; then
            find out -name '*.js' -size +1M -exec ls -lh {} \;
            echo "::error::JS bundle over 1 MB in the export"; exit 1
          fi
          echo "out/ is $(du -sh out | cut -f1)"
